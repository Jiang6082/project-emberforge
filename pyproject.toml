[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberforge"
version = "0.1.0"
description = "Project Emberforge — AI-assisted factor research with false-discovery control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charles Jiang" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
llm = ["anthropic>=0.40"]  # optional real LLM provider; core runs without it

[project.scripts]
emberforge = "emberforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emberforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end / bootstrap-heavy tests (run the fast core with -m 'not slow')",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length — long report/markdown f-strings read better unwrapped
    "E702",   # compact one-liner wiring (CLI arg definitions)
    "E731",   # lambda assignment — used deliberately for small local statistics
    "E741",   # ambiguous variable name (l/O/I) — algebra-style locals
    "B008",   # function call in default arg — Pydantic Field/dataclass defaults
    "B905",   # zip() without strict — sequences are known equal-length here
    "UP042",  # str+Enum kept over StrEnum to preserve exact str() behaviour
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E712", "E702", "B011", "B017", "F841"]  # truth-compares / broad asserts / locals in tests
